<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sukonoe.c11.eu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #05070d; color: #e6edf3;
  }
  #scene { position: fixed; inset: 0; display: block; }
  .hud {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    text-align: center; z-index: 10; width: min(92vw, 640px);
    background: rgba(13, 17, 23, .62);
    border: 1px solid #30363d; border-radius: 16px;
    padding: 1.1rem 1.4rem 1.3rem;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .hud h1 { font-size: 1.6rem; letter-spacing: .5px; }
  .hud h1 span { color: #58a6ff; }
  #shapeName {
    display: inline-block; margin: .45rem 0 .8rem;
    font-size: .8rem; letter-spacing: 3px; text-transform: uppercase;
    color: #f778ba; font-weight: 700;
  }
  .btns { display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center; }
  .btns button {
    background: #161b22; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 999px;
    padding: .45rem .95rem; font-size: .8rem; cursor: pointer;
    transition: all .18s ease;
  }
  .btns button:hover, .btns button.active {
    border-color: #58a6ff; color: #58a6ff;
    box-shadow: 0 0 12px rgba(88,166,255,.35);
  }
  .links { margin-top: .9rem; }
  .links a { color: #8b949e; font-size: .85rem; margin: 0 .7rem; text-decoration: none; }
  .links a:hover { color: #58a6ff; }
  .hint { margin-top: .5rem; font-size: .72rem; color: #6e7681; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <h1>sukonoe<span>.c11.eu</span></h1>
  <div id="shapeName">Cube</div>
  <div class="btns" id="btns"></div>
  <div class="links">
    <a href="https://github.com/joestar-1">GitHub</a>
    <a href="mailto:sukonoe356@proton.me">Contact</a>
  </div>
  <div class="hint">drag to orbit &bull; scroll to zoom &bull; morphs every 5s</div>
</div>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070d, 0.045);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.2, 9);

// lights
scene.add(new THREE.AmbientLight(0x334455, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(5, 8, 6); scene.add(key);
const blue = new THREE.PointLight(0x58a6ff, 60, 40); blue.position.set(-6, 2, 4); scene.add(blue);
const pink = new THREE.PointLight(0xf778ba, 60, 40); pink.position.set(6, -3, 3); scene.add(pink);

// starfield
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 30 + Math.random() * 60, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(p) * Math.cos(t); pos[i*3+1] = r * Math.sin(p) * Math.sin(t); pos[i*3+2] = r * Math.cos(p);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8b949e, size: 0.14, transparent: true, opacity: 0.8 })));
}

// morphing mesh: solid + wireframe twin
const solid = new THREE.Mesh(
  new THREE.BufferGeometry(),
  new THREE.MeshStandardMaterial({ color: 0x1f6feb, metalness: 0.55, roughness: 0.25, flatShading: true })
);
const wire = new THREE.Mesh(
  new THREE.BufferGeometry(),
  new THREE.MeshBasicMaterial({ color: 0x79c0ff, wireframe: true, transparent: true, opacity: 0.35 })
);
const group = new THREE.Group(); group.add(solid, wire); scene.add(group);

const SHAPES = [
  ['Cube',          () => new THREE.BoxGeometry(2.6, 2.6, 2.6)],
  ['Sphere',        () => new THREE.SphereGeometry(1.7, 48, 32)],
  ['Torus Knot',    () => new THREE.TorusKnotGeometry(1.25, 0.42, 220, 32)],
  ['Icosahedron',   () => new THREE.IcosahedronGeometry(1.9, 1)],
  ['Torus',         () => new THREE.TorusGeometry(1.5, 0.55, 32, 72)],
  ['Octahedron',    () => new THREE.OctahedronGeometry(2.0, 1)],
  ['Dodecahedron',  () => new THREE.DodecahedronGeometry(1.9, 0)],
  ['Capsule',       () => new THREE.CapsuleGeometry(0.95, 1.6, 12, 24)],
];
let current = 0, morph = 1; // morph: 1 = full size, 0 = imploded
let morphDir = 0, holdUntil = performance.now() + 5000;
const label = document.getElementById('shapeName');
const btnWrap = document.getElementById('btns');

function setShape(i) {
  solid.geometry.dispose(); wire.geometry.dispose();
  const g = SHAPES[i][1]();
  solid.geometry = g; wire.geometry = g.clone();
  // recolor each form
  solid.material.color.setHSL((i * 0.13 + 0.58) % 1, 0.75, 0.55);
  label.textContent = SHAPES[i][0];
  [...btnWrap.children].forEach((b, j) => b.classList.toggle('active', j === i));
}
SHAPES.forEach(([name], i) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.onclick = () => { if (i !== current) { current = i; morphDir = -1; [...btnWrap.children].forEach((x, j) => x.classList.toggle('active', j === i)); } };
  btnWrap.appendChild(b);
});
setShape(0);

// orbit: drag to rotate, wheel to zoom (lightweight custom control)
let targetRX = 0.35, targetRY = 0.6, dist = 9, dragging = false, px = 0, py = 0;
addEventListener('pointerdown', e => { if (e.target === canvas) { dragging = true; px = e.clientX; py = e.clientY; } });
addEventListener('pointermove', e => {
  if (dragging) { targetRY += (e.clientX - px) * 0.008; targetRX += (e.clientY - py) * 0.006;
    targetRX = Math.max(-1.2, Math.min(1.2, targetRX)); px = e.clientX; py = e.clientY; }
  else { targetRY += ((e.clientX / innerWidth - 0.5) * 0.6 + 0.6 - targetRY) * 0.02; }
});
addEventListener('pointerup', () => dragging = false);
addEventListener('wheel', e => { dist = Math.max(4.5, Math.min(16, dist + e.deltaY * 0.005)); }, { passive: true });

// mouse glow follows cursor
const glow = new THREE.PointLight(0xffffff, 12, 15); scene.add(glow);
addEventListener('pointermove', e => {
  glow.position.set((e.clientX / innerWidth - 0.5) * 12, -(e.clientY / innerHeight - 0.5) * 8, 3);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // auto-morph cycle
  if (morphDir === 0 && now > holdUntil) morphDir = -1;
  if (morphDir === -1) { morph -= dt * 2.4;
    if (morph <= 0) { morph = 0; current = (current + 1) % SHAPES.length; setShape(current); morphDir = 1; } }
  else if (morphDir === 1) { morph += dt * 1.8;
    if (morph >= 1) { morph = 1; morphDir = 0; holdUntil = now + 5000; } }

  const s = morphDir === 1 ? easeOutBack(Math.min(1, morph)) : morph;
  const sc = Math.max(0.0001, s);
  group.scale.setScalar(sc);
  group.rotation.y += dt * (0.5 + (1 - morph) * 6);
  group.rotation.x += dt * 0.25;
  group.position.y = Math.sin(now * 0.0012) * 0.35;

  camera.position.x += ((Math.sin(targetRY) * dist) - camera.position.x) * 0.06;
  camera.position.z += ((Math.cos(targetRY) * dist) - camera.position.z) * 0.06;
  camera.position.y += ((1.2 + targetRX * 3) - camera.position.y) * 0.06;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
